# ============================================================
#  EquipLink Backend – Production Profile
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:equiplink}
    username: ${DATABASE_USERNAME:equiplink_user}
    password: ${DATABASE_PASSWORD:localpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  gemini:
    api-key: ${GEMINI_API_KEY}

logging:
  level:
    com.equiplink: INFO
    org.springframework.security: WARN
