# ============================================================
#  EquipLink Backend – Global YAML Configuration
# ============================================================

spring:
  application:
    name: equiplink-backend
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 300MB
      max-request-size: 500MB

server:
  port: 8080
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 500MB
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# ---- Swagger / OpenAPI ----
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ---- Custom App Config Placeholders ----
app:
  jwt:
    cookie-name: equiplink_auth
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    api-key: ${GEMINI_API_KEY:}
